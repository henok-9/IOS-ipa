name: Antigrav
options:
  bundleIdPrefix: com.antigrav
  deploymentTarget:
    iOS: "16.0"
targets:
  Antigrav:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AntigravIOS
    info:
      path: AntigravIOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: Antigrav
        PRODUCT_BUNDLE_IDENTIFIER: com.antigrav.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
