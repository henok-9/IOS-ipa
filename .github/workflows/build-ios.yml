name: Build iOS IPA (SideStore)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Compile iOS App (Unsigned ARM64 Device Binary)
        run: |
          xcodebuild build \
            -project Antigrav.xcodeproj \
            -scheme Antigrav \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Antigrav.app Payload/
          zip -r -9 Antigrav.ipa Payload
          ls -lh Antigrav.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigrav-SideStore-IPA
          path: Antigrav.ipa
          retention-days: 14
